<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DualLens Perspective Card</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div>
      <div class="brand">DUALLENS</div>
      <div class="subbrand">Same story. Different lens.</div>
    </div>
    <button id="exportBtn" class="primary" type="button">Export PNG</button>
  </header>

  <main class="app">
    <section class="editor panel">
      <p class="eyebrow">CREATE CARD</p>

      <label>
        Headline
        <textarea id="headline" rows="3">Trump announces new tariffs</textarea>
      </label>

      <div class="two-col">
        <label>
          Lens A
          <input id="leftLabel" value="SUPPORTERS">
        </label>
        <label>
          Lens B
          <input id="rightLabel" value="CRITICS">
        </label>
      </div>

      <div class="two-col">
        <label>
          Lens A points
          <textarea id="leftPoints" rows="6">Protects U.S. jobs
Builds domestic factories
Strengthens national security</textarea>
        </label>
        <label>
          Lens B points
          <textarea id="rightPoints" rows="6">Raises consumer prices
Hurts small businesses
Risks trade retaliation</textarea>
        </label>
      </div>

      <div class="two-col">
        <label>
          Lens A source names
          <textarea id="leftSourceNames" rows="4">Reuters
White House
@TradePolicy</textarea>
        </label>
        <label>
          Lens B source names
          <textarea id="rightSourceNames" rows="4">AP
Brookings
@EconomistJane</textarea>
        </label>
      </div>

      <div class="two-col">
        <label>
          Lens A links
          <textarea id="leftSourceLinks" rows="5">https://reuters.com/
https://whitehouse.gov/
https://x.com/TradePolicy</textarea>
        </label>
        <label>
          Lens B links
          <textarea id="rightSourceLinks" rows="5">https://apnews.com/
https://brookings.edu/
https://x.com/EconomistJane</textarea>
        </label>
      </div>

      <button id="openSourcesBtn" class="secondary full" type="button">Open source links</button>
      <p id="message" class="message" aria-live="polite"></p>
    </section>

    <section class="preview-area">
      <div class="preview-heading">
        <div>
          <p class="eyebrow">PHONE PREVIEW</p>
          <h1>Perspective Card</h1>
        </div>
        <span class="pill">1080 × 1350</span>
      </div>

      <div id="card" class="perspective-card">
        <div id="cardHeadline" class="card-headline">Trump announces new tariffs</div>

        <div class="lens-header">
          <div id="cardLeftLabel" class="lens-title lens-blue">SUPPORTERS</div>
          <div id="cardRightLabel" class="lens-title lens-red">CRITICS</div>
        </div>

        <div id="comparisonRows" class="comparison-rows"></div>

        <div class="source-footer">
          <div>
            <div class="source-label">LENS A SOURCES</div>
            <div id="leftSourceFooter" class="source-names"></div>
          </div>
          <div>
            <div class="source-label">LENS B SOURCES</div>
            <div id="rightSourceFooter" class="source-names"></div>
          </div>
        </div>
      </div>

      <canvas id="exportCanvas" width="1080" height="1350" hidden></canvas>
    </section>
  </main>

  <dialog id="sourceDialog">
    <div class="dialog-top">
      <div>
        <p class="eyebrow">SOURCES</p>
        <h2>Open links</h2>
      </div>
      <button id="closeDialogBtn" class="secondary" type="button">Close</button>
    </div>
    <div class="dialog-grid">
      <section>
        <h3 id="dialogLeftTitle">Lens A</h3>
        <div id="dialogLeftLinks"></div>
      </section>
      <section>
        <h3 id="dialogRightTitle">Lens B</h3>
        <div id="dialogRightLinks"></div>
      </section>
    </div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
