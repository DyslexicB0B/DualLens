<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DualLens Studio</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app-shell">
    <section class="editor-panel">
      <div class="brand-row">
        <div>
          <p class="eyebrow">DUALLENS</p>
          <h1>Post Studio</h1>
        </div>
        <div class="header-actions"><button id="themeBtn" class="secondary" type="button">Dark mode</button><span class="status-pill">GitHub Pages Ready</span></div>
      </div>

      <p class="intro">Build a balanced social post, preview it live, and export it as a PNG.</p>

      <label>
        Story label
        <input id="storyLabel" value="TODAY'S STORY" maxlength="30" />
      </label>

      <label>
        Headline
        <textarea id="headline" rows="3" maxlength="120">Congress debates a new national immigration proposal</textarea>
      </label>

      <div class="two-col">
        <label>
          Left heading
          <input id="leftHeading" value="SUPPORTERS" maxlength="24" />
        </label>
        <label>
          Right heading
          <input id="rightHeading" value="CRITICS" maxlength="24" />
        </label>
      </div>

      <div class="two-col">
        <label>
          Left perspective
          <textarea id="leftPoints" rows="7">Strengthens border enforcement
Clarifies asylum standards
Adds resources for processing
May reduce illegal crossings</textarea>
          <small>One point per line</small>
        </label>

        <label>
          Right perspective
          <textarea id="rightPoints" rows="7">Could limit humanitarian access
May separate families
Adds enforcement costs
Could affect labor markets</textarea>
          <small>One point per line</small>
        </label>
      </div>

      <label>
        Common ground
        <textarea id="commonGround" rows="3" maxlength="180">Both sides agree the current system is overwhelmed and needs clearer rules, faster processing, and better enforcement.</textarea>
      </label>

      <label>
        Why it matters
        <textarea id="whyMatters" rows="3" maxlength="180">The outcome could affect border operations, employers, asylum seekers, local governments, and federal spending.</textarea>
      </label>

      <label>
        Sources
        <input id="sources" value="AP • Reuters • Congressional summary" maxlength="90" />
      </label>

      <div class="two-col">
        <label>
          Visual template
          <select id="templateStyle">
            <option value="newsroom">Newsroom</option>
            <option value="minimal">Minimal</option>
            <option value="bold">Bold</option>
          </select>
        </label>
        <label>
          Draft name
          <input id="draftName" value="Untitled Story" maxlength="50" />
        </label>
      </div>

      <div class="two-col">
        <label>
          Export format
          <select id="format">
            <option value="portrait">Portrait · 1080 × 1350</option>
            <option value="square">Square · 1080 × 1080</option>
            <option value="landscape">X Landscape · 1600 × 900</option>
          </select>
        </label>

        <label>
          Column labels
          <select id="labelStyle">
            <option value="custom">Use my headings</option>
            <option value="leftRight">Left Lens / Right Lens</option>
            <option value="forAgainst">Arguments For / Against</option>
          </select>
        </label>
      </div>

      <div class="actions">
        <button id="downloadBtn" class="primary">Export PNG</button>
        <button id="saveBtn" class="secondary">Save Draft</button>
        <button id="resetBtn" class="secondary">Reset Example</button>
      </div>

      <p id="message" class="message" aria-live="polite"></p>

      <div class="drafts-box">
        <div class="drafts-head"><strong>Saved drafts</strong><button id="clearDraftsBtn" class="text-button" type="button">Clear all</button></div>
        <div id="draftList" class="draft-list"></div>
      </div>
    </section>

    <section class="preview-panel">
      <div class="preview-header">
        <div>
          <p class="eyebrow">LIVE PREVIEW</p>
          <h2>Your post</h2>
        </div>
        <span id="sizeBadge" class="status-pill">1080 × 1350</span>
      </div>

      <div class="canvas-wrap">
        <canvas id="previewCanvas" width="1080" height="1350"></canvas>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
