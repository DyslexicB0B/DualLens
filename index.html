<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DualLens Studio 6.0</title>
  <link rel="stylesheet" href="duallens-v6.css?v=600">
</head>
<body>
<header class="topbar">
  <div class="brand-lockup">
    <svg class="logo-icon" viewBox="0 0 72 44" aria-hidden="true">
      <circle cx="25" cy="22" r="18" fill="#185fe6"/>
      <circle cx="47" cy="22" r="18" fill="#ef3038"/>
      <path d="M36 7a18 18 0 0 1 0 30a18 18 0 0 1 0-30Z" fill="#172033" opacity=".72"/>
    </svg>
    <div><div class="brand-name">DualLens</div><div class="tagline">Same story. Different lens.</div></div>
  </div>
  <div class="top-actions">
    <button id="saveJpegBtn" class="secondary">Save JPEG</button>
    <button id="shareBtn" class="primary">Share</button>
  </div>
</header>

<main class="app">
  <section class="controls panel">
    <p class="eyebrow">LENS CARD</p>
    <label>Headline<textarea id="headline" rows="3" maxlength="110">Biden Calls for Israel Ceasefire</textarea></label>

    <label>Perspective distance
      <div class="distance-control">
        <input id="distanceScore" type="range" min="1" max="10" step="0.1" value="8.2">
        <output id="distanceOutput">8.2 / 10</output>
      </div>
    </label>

    <label>Distance caption<input id="distanceCaption" value="Very different perspectives" maxlength="42"></label>



    <div class="upload-grid">
      <div class="upload-side left-side">
        <div class="side-title">Left lens</div>
        <label class="upload-card" for="leftImageInput"><span class="upload-icon">＋</span><span>Choose screenshot</span><input id="leftImageInput" type="file" accept="image/*"></label>
        <div class="image-mode-row" role="group" aria-label="Left image mode">
          <button id="leftReadableBtn" class="image-mode-btn active" type="button">Readable</button>
          <button id="leftFullBtn" class="image-mode-btn" type="button">Full</button>
        </div>
        <label class="zoom-label">Zoom
          <input id="leftZoom" type="range" min="1" max="3" step="0.02" value="1.18">
        </label>

        <label>Lens label<input id="leftLabel" value="LEFT LENS" maxlength="24"></label>
      </div>

      <div class="upload-side right-side">
        <div class="side-title">Right lens</div>
        <label class="upload-card" for="rightImageInput"><span class="upload-icon">＋</span><span>Choose screenshot</span><input id="rightImageInput" type="file" accept="image/*"></label>
        <div class="image-mode-row" role="group" aria-label="Right image mode">
          <button id="rightReadableBtn" class="image-mode-btn active" type="button">Readable</button>
          <button id="rightFullBtn" class="image-mode-btn" type="button">Full</button>
        </div>
        <label class="zoom-label">Zoom
          <input id="rightZoom" type="range" min="1" max="3" step="0.02" value="1.18">
        </label>

        <label>Lens label<input id="rightLabel" value="RIGHT LENS" maxlength="24"></label>
      </div>
    </div>

    
    <label>Export layout
      <div class="layout-switch" role="group" aria-label="Export layout">
        <button id="stackedLayoutBtn" class="layout-btn active" type="button">X Full-Width</button>
        <button id="sideLayoutBtn" class="layout-btn" type="button">Side-by-side</button>
      </div>
    </label>
<label>X post text<textarea id="postCopy" rows="5">Same story. Different lens.

Compare the original posts and decide for yourself.</textarea></label>

    <div class="action-row">
      <button id="previewBtn" class="secondary">Phone preview</button>
      <button id="copyImageBtn" class="secondary">Copy image</button>
      <button id="openXBtn" class="secondary">Post to X</button>
      <button id="downloadBtn" class="primary">Download PNG</button>
    </div>
    <p id="message" class="message"></p>
  </section>

  <section class="preview-wrap">
    <div class="preview-header"><div><p class="eyebrow">LIVE PREVIEW</p><h2>Lens Card</h2></div><span class="pill">1080 × 1350</span></div>
    <div class="canvas-shell"><canvas id="liveCanvas" width="1080" height="1350"></canvas></div>
  </section>
</main>

<dialog id="previewDialog">
  <div class="dialog-head"><h2>Phone preview</h2><button id="closePreviewBtn" class="secondary">Close</button></div>
  <div class="phone"><div class="post"><div class="avatar">D</div><div class="post-body"><div class="post-meta"><strong>DualLens</strong> <span>@DualLens · now</span></div><div id="phoneCopy" class="phone-copy"></div><img id="phoneImage" alt="DualLens preview"></div></div></div>
</dialog>

<script src="duallens-v6.js?v=600"></script>
</body>
</html>
